services:

  postgres:
    image: pgvector/pgvector:pg17
    container_name: docmind-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: docmind
      POSTGRES_PASSWORD: docmind123
      POSTGRES_DB: docmind

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docmind -d docmind"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: docmind-backend:latest
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: docmind-backend
    restart: unless-stopped

    environment:
      DATABASE_URL: postgresql://docmind:docmind123@postgres:5432/docmind
      OLLAMA_URL: http://host.docker.internal:11434

    ports:
      - "8000:8000"

    depends_on:
      postgres:
        condition: service_healthy

    volumes:
      - ../backend/uploads:/app/uploads

volumes:
  postgres_data: